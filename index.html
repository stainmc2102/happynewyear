<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tết 2026 - Đếm Ngược & Chúc Tết</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        :root {
            --primary: #FFD700;
            --secondary: #DC143C;
            --dark-red: #8B0000;
            --light-gold: #FFFACD;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #000814 0%, #001d3d 50%, #000000 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.15;
            z-index: 0;
            animation: starScroll 100s linear infinite;
        }

        @keyframes starScroll {
            from { background-position: 0 0, 40px 60px, 130px 270px; }
            to { background-position: 550px 550px, 390px 410px, 380px 820px; }
        }

        /* Festive Background Elements */
        .blossom {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            width: 20px;
            height: 20px;
            background: #ffb3d9;
            border-radius: 100% 0 100% 0;
            opacity: 0.8;
            box-shadow: inset -2px -2px 5px rgba(255, 105, 180, 0.5);
        }

        .blossom::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #ff69b4;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .blossom.mai {
            background: #ffd700;
        }

        .blossom.mai::after {
            background: #ff8c00;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0) scale(1); opacity: 1; }
            25% { transform: translateY(25vh) rotate(90deg) translateX(20px) scale(0.8); }
            50% { transform: translateY(50vh) rotate(180deg) translateX(-20px) scale(1.1); }
            75% { transform: translateY(75vh) rotate(270deg) translateX(20px) scale(0.9); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(0) scale(1); opacity: 0; }
        }

        .lantern {
            position: absolute;
            top: -20px;
            width: 60px;
            height: 80px;
            background: #FF0000;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            animation: swing 3s ease-in-out infinite;
            transform-origin: top center;
            z-index: 2;
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 2px;
            height: 20px;
            background: #FFD700;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* Main UI */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            color: var(--primary);
            text-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            margin-bottom: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            animation: titleGlow 2s ease-in-out infinite alternate;
            line-height: 1.2;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
            to { text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 0 10px rgba(255, 255, 255, 0.5); }
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: clamp(10px, 3vw, 25px);
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            padding: clamp(15px, 4vw, 30px);
            border-radius: 20px;
            border: 2px solid var(--primary);
            min-width: clamp(80px, 15vw, 150px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: transform 0.3s;
        }

        .time-box:hover {
            transform: scale(1.05);
        }

        .time-value {
            display: block;
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
        }

        .time-label {
            font-size: clamp(0.7rem, 2vw, 1rem);
            color: var(--light-gold);
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 10px;
        }

        #celebration {
            display: none;
            animation: zoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
        }

        #celebration h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: nowrap;
            white-space: nowrap;
            width: 100%;
            margin-bottom: 20px;
        }

        #celebration h1 i {
            font-size: 0.8em;
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .wish-card {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--light-gold);
            margin-top: 1.5rem;
            font-style: italic;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .btn {
            background: var(--primary);
            color: var(--dark-red);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            filter: brightness(1.1);
        }

        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: var(--primary);
            border: 2px solid var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        /* Fireworks */
        canvas#fireworks {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Lucky Envelope (Lì Xì) */
        #lixi-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lixi-envelope {
            width: clamp(180px, 40vw, 220px);
            height: clamp(260px, 60vw, 320px);
            background: #D40000;
            border: 4px solid var(--primary);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .lixi-envelope.open {
            transform: rotateY(180deg);
        }

        .lixi-content, .lixi-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 8px;
        }

        .lixi-back {
            background: var(--light-gold);
            color: var(--dark-red);
            transform: rotateY(180deg);
            text-align: center;
            box-shadow: inset 0 0 20px rgba(139, 0, 0, 0.2);
        }

        .close-lixi-btn {
            margin-top: 30px;
            background: var(--primary);
            color: var(--dark-red);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 10001;
        }

        /* Cursor Trail */
        .cursor-trail {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transition: transform 0.1s;
            opacity: 0.8;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Audio Overlay */
        #audio-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 20000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #audio-overlay i { font-size: 5rem; color: var(--primary); margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div id="audio-overlay">
        <i class="fas fa-volume-up"></i>
        <h2 style="color: var(--primary)">Chạm để mở nhạc Tết 🎉</h2>
    </div>

    <button id="musicBtn" class="music-toggle" title="Bật/Tắt nhạc">
        <i class="fas fa-volume-mute"></i>
    </button>
    <audio id="bgMusic" preload="auto"></audio>
    <div id="youtube-container" style="display:none; position:fixed; width:1px; height:1px; opacity:0; pointer-events:none;">
        <iframe id="youtube-player" width="1" height="1" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <canvas id="fireworks"></canvas>

    <div class="content">
        <div id="countdown-ui">
            <h1 id="header-text">Đếm Ngược Tết 2026</h1>
            <div class="countdown">
                <div class="time-box">
                    <span id="days" class="time-value">00</span>
                    <span class="time-label">Ngày</span>
                </div>
                <div class="time-box">
                    <span id="hours" class="time-value">00</span>
                    <span class="time-label">Giờ</span>
                </div>
                <div class="time-box">
                    <span id="minutes" class="time-value">00</span>
                    <span class="time-label">Phút</span>
                </div>
                <div class="time-box">
                    <span id="seconds" class="time-value">00</span>
                    <span class="time-label">Giây</span>
                </div>
            </div>
        </div>

        <div id="celebration">
            <h1 style="color: var(--primary);">
                <i class="fas fa-holly-berry"></i>
                Chúc Mừng Năm Mới
                <i class="fas fa-holly-berry"></i>
            </h1>
            <div id="random-wish" class="wish-card"></div>
            <div style="margin-top: 40px; width: 100%; display: flex; justify-content: center;">
                <button class="btn" onclick="openLixi()">
                    <i class="fas fa-envelope-open-text"></i> Nhận Lì Xì May Mắn
                </button>
            </div>
        </div>

        <div id="tet-ended" style="display:none;">
            <h1 style="color: var(--primary);">Tết Đã Qua 5 Ngày 🎉</h1>
            <p class="wish-card">Hẹn gặp lại vào Tết năm sau nhé! 🧧</p>
            <p style="color: var(--light-gold); margin-top: 20px;">Chúc bạn một năm mới vạn sự như ý!</p>
        </div>
        <div style="margin-top: auto; padding: 20px; color: var(--light-gold); opacity: 0.6; font-size: 0.8rem;">
            Made by Stain ©
        </div>
    </div>

    <div class="controls">
        <button id="dev-plus" class="btn" style="display:none" onclick="add10s()">+10s</button>
        <button id="dev-skip" class="btn" style="display:none" onclick="forceNewYear()">Skip to NY</button>
    </div>

    <div id="lixi-modal">
        <div class="lixi-envelope" id="lixi-envelope" onclick="handleLixiClick(event)">
            <div class="lixi-content">
                <i class="fas fa-envelope" style="font-size: 5rem; color: var(--primary)"></i>
                <p style="color: var(--primary); margin-top: 20px; font-weight: 800;">LÌ XÌ MAY MẮN</p>
            </div>
            <div class="lixi-back">
                <h3 id="lixi-val" style="font-size: 1.5rem; margin-bottom: 10px;">🧧</h3>
                <p id="lixi-msg">Chúc bạn một năm mới bình an!</p>
            </div>
        </div>
        <button id="close-lixi-btn" class="close-lixi-btn" onclick="closeLixi()">Đóng Lì Xì</button>
    </div>

    <script src="config.js"></script>
    <script>
        // Check for /test route via hash or query param (simulated for static hosting)
        const isTestRoute = window.location.search.includes('test') || window.location.hash.includes('test');
        let testStartTime = null;

        if (isTestRoute) {
            console.log("Running in TEST mode (20s countdown)");
            testStartTime = new Date();
        }

        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicIcon = musicBtn.querySelector('i');
        const audioOverlay = document.getElementById('audio-overlay');
        const ytPlayer = document.getElementById('youtube-player');
        
        audio.src = CONFIG.MUSIC_PATH;
        let musicPlayed = false;
        let isMuted = false;

        // Force Autoplay Logic - Only for celebration
        function tryAutoplay() {
            if (isCelebrating && !musicPlayed) {
                audio.play().then(() => {
                    musicPlayed = true;
                    musicIcon.className = 'fas fa-volume-up';
                    audioOverlay.style.display = 'none';
                }).catch(() => {
                    audioOverlay.style.display = 'flex';
                });
            }
        }

        // Mouse Trail
        const dots = [];
        for(let i=0; i<8; i++) {
            const dot = document.createElement('div');
            dot.className = 'cursor-trail';
            document.body.appendChild(dot);
            dots.push(dot);
        }

        let mouseX = 0, mouseY = 0;
        window.onmousemove = (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        };

        function animateDots() {
            let x = mouseX, y = mouseY;
            dots.forEach((dot, index) => {
                dot.style.left = x - 4 + 'px';
                dot.style.top = y - 4 + 'px';
                dot.style.transform = `scale(${(dots.length - index) / dots.length})`;
                
                const nextDot = dots[index + 1] || dots[0];
                x += (nextDot.offsetLeft - dot.offsetLeft) * 0.3;
                y += (nextDot.offsetTop - dot.offsetTop) * 0.3;
            });
            requestAnimationFrame(animateDots);
        }
        animateDots();

        // Interaction to unlock audio
        document.body.onclick = () => {
            if (isCelebrating && !musicPlayed) tryAutoplay();
        };

        function toggleMusic() {
            isMuted = !isMuted;
            if (isMuted) {
                audio.pause();
                // Mute YouTube via postMessage
                ytPlayer.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                musicIcon.className = 'fas fa-volume-mute';
                localStorage.setItem('musicEnabled', 'false');
            } else {
                if (isCelebrating) {
                    audio.play();
                    // Unmute YouTube via postMessage
                    ytPlayer.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                }
                musicIcon.className = 'fas fa-volume-up';
                localStorage.setItem('musicEnabled', 'true');
            }
        }

        musicBtn.onclick = toggleMusic;
        audioOverlay.onclick = () => {
            audio.play().then(() => {
                musicPlayed = true;
                musicIcon.className = 'fas fa-volume-up';
                audioOverlay.style.display = 'none';
                localStorage.setItem('musicEnabled', 'true');
            });
        };

        // UI Polish - Blossoms & Lanterns
        function createBlossom() {
            const blossom = document.createElement('div');
            blossom.className = 'blossom';
            const isMai = Math.random() > 0.5;
            blossom.className += isMai ? ' mai' : '';
            blossom.style.left = Math.random() * 100 + 'vw';
            blossom.style.top = '-20px'; // Ensure start from top
            blossom.style.fontSize = (Math.random() * 20 + 15) + 'px';
            blossom.style.animation = `fall ${Math.random() * 5 + 7}s linear forwards`;
            document.body.appendChild(blossom);
            setTimeout(() => blossom.remove(), 12000);
        }
        setInterval(createBlossom, 500);

        function createLantern() {
            const lantern = document.createElement('div');
            lantern.className = 'lantern';
            lantern.style.left = Math.random() * 90 + 'vw';
            lantern.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(lantern);
        }
        for(let i=0; i<6; i++) createLantern();

        // Wishes
        const wishes = [
            "An Khang Thịnh Vượng - Vạn Sự Như Ý",
            "Sức Khỏe Dồi Dào - Tiền Vào Như Nước",
            "Cung Chúc Tân Xuân - Phước Lộc Thọ",
            "Tấn Tài Tấn Lộc - Công Thành Danh Toại",
            "Học Giỏi - Code Mượt - Bug Ít 💻",
            "Mừng Xuân Sang - Vạn Điều May Mắn"
        ];

        // 🎉 Lì xì Gen Z thêm
        const lixiRewards = [
            { val: "🧧 5.000 VNĐ", msg: "Cũng được, đủ mua gói Hảo Hảo sống qua ngày 😌" },
            { val: "🧧 500.000 VNĐ", msg: "Ơ kìa, trúng to thế này là phải bao trà sữa rồi 🤑" },
            { val: "💋 1 Nụ Hôn", msg: "Cái này tự đi xin nha, web không lo phần này 😏" },
            { val: "🧧 Thêm 1 Lần Nữa", msg: "Chưa tới đâu, quay lại phát nữa xem sao 🤞" },
            { val: "🧧 Thoát Ế", msg: "Năm nay có người nhắn tin mỗi tối rồi đó 😉" },
            { val: "🧧 Code Không Bug", msg: "Ước mơ hơi xa nhưng thôi cứ tin đi 💻" },
            { val: "🧧 1 Ly Trà Sữa", msg: "Không nhiều nhưng đủ vui cái miệng 🧋" },
            { val: "🧧 Wifi Full Vạch", msg: "Mạng mạnh, khỏi chửi modem đầu năm 👍" },
            { val: "🧧 Hết Deadline", msg: "Tết này không ai réo việc, yên tâm nghỉ 😴" },
            { val: "🧧 Nhân Phẩm +100", msg: "Tự nhiên thấy mình đỏ hẳn ra ✨" },
            { val: "🧧 Ví Không Bao Giờ Rỗng", msg: "Không giàu nhưng lúc mở ví là không buồn 💸" },
            { val: "🧧 Không Bug Khi Deploy", msg: "Đẩy code xong là chạy, không ai gọi lại 🔥" },
            { val: "🧧 Được Crush Rep Inbox", msg: "Tối nay ting ting điện thoại là biết ai rồi đó 🥰" },
            { val: "🧧 Da Trắng Dáng Xinh", msg: "Tết này chụp ảnh không cần dùng filter luôn 📸" },
            { val: "🧧 Đi Du Lịch Muôn Nơi", msg: "Săn được vé rẻ, xách balo lên và đi thôi ✈️" },
            { val: "🧧 Mua Gì Cũng Được Giảm Giá", msg: "Thần deal độ bạn, mua sắm không lo nhìn giá 🛍️" },
            { val: "🧧 Body 6 Múi / Đồng Hồ Cát", msg: "Ăn bánh chưng thả ga mà vẫn mlem mlem 💪" }
        ];

        function openLixi() {
            document.getElementById('lixi-modal').style.display = 'flex';
            document.getElementById('lixi-envelope').classList.remove('open');
            document.getElementById('close-lixi-btn').style.display = 'none';
        }

        function handleLixiClick(e) {
            e.stopPropagation();
            const env = document.getElementById('lixi-envelope');
            if (!env.classList.contains('open')) {
                const reward = lixiRewards[Math.floor(Math.random() * lixiRewards.length)];
                document.getElementById('lixi-val').textContent = reward.val;
                document.getElementById('lixi-msg').textContent = reward.msg;
                env.classList.add('open');
                setTimeout(() => {
                    document.getElementById('close-lixi-btn').style.display = 'block';
                }, 800);
            }
        }

        function closeLixi() {
            document.getElementById('lixi-modal').style.display = 'none';
        }

        // Countdown Logic
        let offset = 0;
        let isCelebrating = false;

        if (isTestRoute) {
            document.getElementById('dev-plus').style.display = 'block';
            document.getElementById('dev-skip').style.display = 'block';
        }

        function add10s() { offset += 10; update(); }
        function forceNewYear() {
            if (isTestRoute) {
                const now = new Date();
                const elapsed = (now - testStartTime) / 1000;
                offset = 21 - elapsed; // Force it to pass 20s
            } else {
                const timeToNy = (CONFIG.TARGET_TIME - new Date()) / 1000;
                offset = timeToNy + 1;
            }
            update();
        }

        function playNewYearMusic() {
            if (musicPlayed || isMuted) return;
            
            // Set up listener for local audio end
            audio.onended = () => {
                const ytPlayer = document.getElementById('youtube-player');
                ytPlayer.src = CONFIG.YOUTUBE_URL;
                document.getElementById('youtube-container').style.display = 'block';
            };

            audio.play().then(() => {
                musicPlayed = true;
                musicIcon.className = 'fas fa-volume-up';
            }).catch(err => {
                console.log("Autoplay blocked:", err);
                audioOverlay.style.display = 'flex';
            });
        }

        function update() {
            let now = new Date();
            let baseTime = now;
            
            if (isTestRoute) {
                // TEST mode: 20s countdown regardless of actual date
                const elapsedSinceLoad = (now - testStartTime) / 1000;
                const remaining = 20 - elapsedSinceLoad + offset;
                
                if (remaining <= 0) {
                    if (!isCelebrating) {
                        isCelebrating = true;
                        document.getElementById('countdown-ui').style.display = 'none';
                        document.getElementById('celebration').style.display = 'block';
                        document.getElementById('random-wish').textContent = wishes[Math.floor(Math.random() * wishes.length)];
                        playNewYearMusic();
                        startFireworks();
                    }
                    return;
                }

                const d = 0, h = 0, m = 0;
                const s = Math.floor(remaining);

                document.getElementById('days').textContent = "00";
                document.getElementById('hours').textContent = "00";
                document.getElementById('minutes').textContent = "00";
                document.getElementById('seconds').textContent = s.toString().padStart(2, '0');
                return;
            }

            // NORMAL mode
            const diff = CONFIG.TARGET_TIME - (now.getTime() + (offset * 1000));

            if (diff <= 0) {
                if (!isCelebrating) {
                    isCelebrating = true;
                    document.getElementById('countdown-ui').style.display = 'none';
                    document.getElementById('celebration').style.display = 'block';
                    document.getElementById('random-wish').textContent = wishes[Math.floor(Math.random() * wishes.length)];
                    playNewYearMusic();
                    startFireworks();
                }
                
                // If it's more than 5 days past Tet
                if (diff < -5 * 24 * 60 * 60 * 1000) {
                    document.getElementById('celebration').style.display = 'none';
                    document.getElementById('tet-ended').style.display = 'block';
                }
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);
            const s = Math.floor((diff / 1000) % 60);

            document.getElementById('days').textContent = d.toString().padStart(2, '0');
            document.getElementById('hours').textContent = h.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = m.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = s.toString().padStart(2, '0');
        }

        const startTime = new Date();
        let updateInterval = setInterval(update, 1000);
        update();

        // Canvas Fireworks
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId = null;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
                this.alpha = 1; this.friction = 0.95;
            }
            draw() {
                ctx.globalAlpha = this.alpha; ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill();
            }
            update() {
                this.velocity.x *= this.friction; this.velocity.y *= this.friction;
                this.x += this.velocity.x; this.y += this.velocity.y;
                this.alpha -= 0.01;
            }
        }

        function startFireworks() {
            function animate() {
                if (!isCelebrating) {
                    cancelAnimationFrame(animationFrameId);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                animationFrameId = requestAnimationFrame(animate);
                ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                if (Math.random() < 0.05) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height / 2;
                    const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    for (let i = 0; i < 40; i++) particles.push(new Particle(x, y, color));
                }
                
                particles = particles.filter(p => p.alpha > 0);
                particles.forEach(p => { p.update(); p.draw(); });
            }
            animate();
            setTimeout(() => { 
                isCelebrating = false; 
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                ctx.clearRect(0,0,canvas.width,canvas.height); 
            }, 20000);
        }

        // Easter Egg
        let keys = '';
        window.onkeydown = (e) => {
            keys += e.key;
            if (keys.includes('tet')) {
                startFireworks();
                keys = '';
                alert('🧧 Chúc mừng bạn tìm thấy Easter Egg! Pháo hoa x2!');
            }
            if (keys.length > 10) keys = keys.slice(1);
        };
    </script>
</body>
